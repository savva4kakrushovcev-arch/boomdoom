<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DOOM (1993)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; color:#eee; font-family:system-ui,sans-serif; overflow:hidden; }
    .wrap { height:100%; display:grid; grid-template-rows:auto 1fr auto; }
    header, footer { padding:8px 12px; background:#111; font-size:12px; }
    header { display:flex; justify-content:space-between; align-items:center; color:#e0a106; letter-spacing:.12em; text-transform:uppercase; }
    footer { color:#888; }
    #dos { width:100%; height:100%; min-height:240px; background:#000; }
    .overlay { position:fixed; inset:0; display:grid; place-items:center; background:#000d; z-index:9; }
    .overlay.hidden { display:none; }
    .card { width:min(380px,92vw); background:#161616; border:1px solid #333; padding:22px 18px; text-align:center; }
    .card h2 { color:#c0392b; letter-spacing:.14em; margin:0 0 8px; }
    .card p { font-size:13px; color:#bbb; margin:0 0 16px; }
    button { border:0; background:#c0392b; color:#fff; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:12px 18px; cursor:pointer; }
    .err { color:#ff6b6b; font-size:13px; margin-top:10px; display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><span>DOOM · 1993</span><span>js-dos</span></header>
    <div id="dos"></div>
    <footer>Стрелки — ход · Ctrl — огонь · Space — открыть · клик по экрану захватывает мышь</footer>
  </div>
  <div class="overlay" id="start">
    <div class="card">
      <h2>DOOM</h2>
      <p>Первый DOOM через эмулятор DOS. После загрузки кликните в окно игры.</p>
      <button type="button" id="play">Играть</button>
      <div class="err" id="err"></div>
    </div>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#000"); tg.setBackgroundColor("#000"); } catch(e){} }

    const BUNDLE = "https://cdn.dos.zone/custom/dos/doom.jsdos";
    const errEl = document.getElementById("err");

    document.getElementById("play").onclick = async function () {
      document.getElementById("start").classList.add("hidden");
      try {
        const dos = Dos(document.getElementById("dos"), {
          url: BUNDLE,
          autoStart: true,
          kiosk: true
        });
        if (dos && dos.catch) {
          dos.catch(function (e) {
            showErr(e);
          });
        }
      } catch (e) {
        showErr(e);
      }
    };

    function showErr(e) {
      document.getElementById("start").classList.remove("hidden");
      errEl.style.display = "block";
      errEl.textContent = "Не загрузилось: " + (e && e.message ? e.message : e);
    }
  </script>
</body>
</html>
