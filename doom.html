<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DOOM (1993) — shareware</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
  <style>
    :root {
      --bg: #070707;
      --red: #c0392b;
      --amber: #e0a106;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: #eee;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header, footer {
      padding: 8px 12px;
      background: #111;
      border-color: #222;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
    }
    header h1 {
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--amber);
    }
    header span { font-size: 11px; color: #888; }
    #dos {
      width: 100%;
      height: 100%;
      background: #000;
    }
    canvas, .dosbox-container {
      width: 100% !important;
      height: 100% !important;
    }
    footer {
      font-size: 11px;
      color: #9a9a9a;
      border-top: 1px solid #2a2a2a;
      line-height: 1.45;
    }
    footer b { color: #ddd; }
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.72);
      z-index: 5;
    }
    .overlay.hidden { display: none; }
    .card {
      width: min(360px, 92vw);
      background: #161616;
      border: 1px solid #333;
      padding: 22px 18px;
      text-align: center;
    }
    .card h2 {
      color: var(--red);
      letter-spacing: .12em;
      margin-bottom: 8px;
    }
    .card p { font-size: 13px; color: #bbb; margin-bottom: 16px; }
    button {
      appearance: none;
      border: 0;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 12px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>DOOM · 1993</h1>
      <span>shareware · Knee-Deep in the Dead</span>
    </header>
    <div id="dos"></div>
    <footer>
      <b>Стрелки</b> — ход · <b>Ctrl</b> — огонь · <b>Space</b> — открыть · <b>Alt+стрелки</b> — стрейф · <b>Esc</b> — меню
    </footer>
  </div>

  <div class="overlay" id="start">
    <div class="card">
      <h2>DOOM</h2>
      <p>Оригинальный shareware 1993, первый эпизод. На ПК / в десктопном Telegram. На телефоне управление сложное.</p>
      <button type="button" id="play">Играть</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor("#070707");
        tg.setBackgroundColor("#070707");
      } catch (e) {}
    }

    document.getElementById("play").addEventListener("click", function () {
      document.getElementById("start").classList.add("hidden");
      Dos(document.getElementById("dos"), {
        wdosboxUrl: "https://js-dos.com/6.22/current/wdosbox.js",
        cycles: 2000,
        autolock: true
      }).ready(function (fs, main) {
        fs.extract("https://js-dos.com/cdn/upload/DOOM-@evilution.zip").then(function () {
          return main(["-c", "cd DOOM", "-c", "DOOM.EXE"]);
        });
      });
    });
  </script>
</body>
</html>
